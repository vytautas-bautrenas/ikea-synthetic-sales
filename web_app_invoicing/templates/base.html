<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VAT Invoice — IKEA{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #111827;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .ikea-table-header {
            background-color: #cfd4dc !important;
        }

        /* Dedicated Print Stylesheet for exact A4 matching */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .a4-page {
                width: 100% !important;
                max-width: 100% !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
            }
            @page {
                size: A4 portrait;
                margin: 12mm 15mm 12mm 15mm;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col justify-between">
    <!-- Non-print App Navbar -->
    <header class="no-print bg-blue-800 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-2 text-white no-underline">
                <div class="flex items-center">
                    <svg width="60" height="24" viewBox="0 0 120 48" xmlns="http://www.w3.org/2000/svg">
                        <rect width="120" height="48" fill="#0058A3"/>
                        <ellipse cx="60" cy="24" rx="54" ry="21" fill="#FFDA1A"/>
                        <text x="60" y="32" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="26" fill="#0058A3" text-anchor="middle" letter-spacing="1">IKEA</text>
                    </svg>
                </div>
                <span class="font-semibold text-base tracking-tight ml-2">Invoice Portal</span>
            </a>
            <span class="text-xs text-blue-200">Customer VAT Invoicing</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer for Web View (Hidden on Print) -->
    <footer class="no-print bg-white border-t border-gray-200 py-4 mt-8 text-center text-xs text-gray-500">
        <div class="max-w-4xl mx-auto px-4">
            <p>© {{ now_year if now_year else '2026' }} IKEA Limited. Registered in England and Wales. VAT Reg: GB527773320.</p>
        </div>
    </footer>
</body>
</html>
