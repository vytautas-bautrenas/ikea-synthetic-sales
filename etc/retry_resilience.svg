<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="560" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ikea-sales — Multi-Layer Retry &amp; Fault Resilience Architecture</text>
  <text x="560" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">Defense-in-depth against network timeouts, HTTP 503/429 throttling, socket drops, and partial state corruption</text>

  <!-- LAYER 1 -->
  <rect x="40" y="72" width="1040" height="92" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="56" y="86" width="76" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="94" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0369a1">LAYER</text>
  <text x="94" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0284c7">1</text>
  <text x="148" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">In-Process &amp; Client SDK Retries (Sub-Second to Seconds)</text>
  <text x="148" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155"><tspan font-weight="600" fill="#0369a1">Python Downloaders:</tspan> urllib 3× exponential backoff (1s → 2s) with custom User-Agent and socket timeout safety.</text>
  <text x="148" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155"><tspan font-weight="600" fill="#0369a1">BigQuery &amp; dbt:</tspan> 8MB resumable upload chunks (600s budget) + dbt profile <tspan font-family="monospace" fill="#0f172a">job_retries: 3</tspan> (1800s execution deadline).</text>

  <!-- Transition Arrow 1 to 2 -->
  <path d="M 560 164 L 560 178" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- LAYER 2 -->
  <rect x="40" y="180" width="1040" height="92" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <rect x="56" y="194" width="76" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="94" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d">LAYER</text>
  <text x="94" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#15803d">2</text>
  <text x="148" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Atomic Staging &amp; State Shields (Zero Partial State)</text>
  <text x="148" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155"><tspan font-weight="600" fill="#15803d">File Integrity:</tspan> Streaming download to <tspan font-family="monospace" fill="#0f172a">.part</tspan> temp files, strict byte-size verification before atomic filesystem rename.</text>
  <text x="148" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155"><tspan font-weight="600" fill="#15803d">Database Idempotency:</tspan> BigQuery raw loads use <tspan font-family="monospace" fill="#0f172a">WRITE_TRUNCATE</tspan>; dbt transforms use atomic <tspan font-family="monospace" fill="#0f172a">CREATE OR REPLACE TABLE</tspan>.</text>

  <!-- Transition Arrow 2 to 3 -->
  <path d="M 560 272 L 560 286" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- LAYER 3 -->
  <rect x="40" y="288" width="1040" height="92" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <rect x="56" y="302" width="76" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="94" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">LAYER</text>
  <text x="94" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#b45309">3</text>
  <text x="148" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Airflow Orchestration Retries (Scheduler Level)</text>
  <text x="148" y="338" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155"><tspan font-weight="600" fill="#b45309">Automated Task Retries:</tspan> All 17 DAG tasks inherit uniform <tspan font-family="monospace" fill="#0f172a">retries: 3</tspan> with exponential backoff (30s → 60s → 120s, max 5m).</text>
  <text x="148" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155"><tspan font-weight="600" fill="#b45309">Cold-Start Healing:</tspan> Upstream task failures safely isolate without poisoning downstream steps; re-run starts from clean slate.</text>

  <!-- Transition Arrow 3 to 4 -->
  <path d="M 560 380 L 560 394" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- LAYER 4 -->
  <rect x="40" y="396" width="1040" height="92" rx="12" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.4"/>
  <rect x="56" y="410" width="76" height="64" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="1.2"/>
  <text x="94" y="436" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a21caf">LAYER</text>
  <text x="94" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#a21caf">4</text>
  <text x="148" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Web Application Runtime Resilience (FastAPI &amp; Caches)</text>
  <text x="148" y="446" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155"><tspan font-weight="600" fill="#a21caf">Connection Reuse:</tspan> Shared <tspan font-family="monospace" fill="#0f172a">get_bq_client()</tspan> keeps warm OAuth credentials across HTTP requests, avoiding auth storms.</text>
  <text x="148" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155"><tspan font-weight="600" fill="#a21caf">Self-Healing Caches:</tspan> GeoJSON boundaries cache self-heals on refresh (<tspan font-family="monospace" fill="#0f172a">force_refresh=True</tspan>); Docker <tspan font-family="monospace" fill="#0f172a">restart: unless-stopped</tspan>.</text>

  <!-- Footer -->
  <text x="560" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">Failure flow: In-process transient retry fails → State shields keep data clean → Airflow orchestrates backoff retry → Zero corruption</text>
</svg>
