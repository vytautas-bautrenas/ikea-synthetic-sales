<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UK Sales Heatmap — IKEA{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f8fafc;
        }
        #map {
            height: calc(100vh - 170px);
            min-height: 550px;
            width: 100%;
            z-index: 1;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col justify-between">
    <!-- Top Header / Navigation -->
    <header class="bg-blue-900 text-white shadow-md z-10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center">
            <div class="flex items-center space-x-3">
                <svg width="60" height="24" viewBox="0 0 120 48" xmlns="http://www.w3.org/2000/svg">
                    <rect width="120" height="48" fill="#0058A3"/>
                    <ellipse cx="60" cy="24" rx="54" ry="21" fill="#FFDA1A"/>
                    <text x="60" y="32" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="26" fill="#0058A3" text-anchor="middle" letter-spacing="1">IKEA</text>
                </svg>
                <div class="border-l border-blue-700 pl-3">
                    <h1 class="text-base font-bold tracking-tight leading-none">UK Sales Geographic Heatmap</h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
